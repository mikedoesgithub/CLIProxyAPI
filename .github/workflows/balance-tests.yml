name: Balance router tests
on:
  pull_request:
    paths:
      - 'internal/balance/**'
      - 'internal/config/**'
      - 'sdk/api/handlers/**'
      - 'internal/client/claude/models/**'
      - 'tools/balance/**'
      - '.github/workflows/balance-tests.yml'
  push:
    branches: [feat/balance-router]
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Routing, configuration and handler regression tests
        run: |
          go test -race ./internal/balance ./internal/config ./sdk/api/handlers ./internal/client/claude/models
          go test ./sdk/api/handlers/openai ./sdk/api/handlers/claude ./sdk/api/handlers/gemini -run Balance
      - name: Build server
        run: go build -o /tmp/balance-build ./cmd/server
  classifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/balance/requirements.txt
      - name: Classifier protocol, concurrency and retraining tests
        run: python -W error::ResourceWarning -m unittest discover -s tools/balance -p test_balance.py
      - name: Check installer syntax
        run: bash -n tools/balance/setup.sh
